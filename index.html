<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR-кодов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 100%;
  }

  h1 {
    color: #333;
    margin-bottom: 25px;
    font-size: 26px;
    text-align: center;
  }

  label {
    display: block;
    color: #555;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
  }

  textarea, input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s;
    margin-bottom: 18px;
    outline: none;
  }

  textarea { resize: vertical; min-height: 90px; }

  textarea:focus, input:focus, select:focus {
    border-color: #667eea;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .options {
    display: flex;
    gap: 15px;
    margin-bottom: 18px;
  }

  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    cursor: pointer;
    font-weight: 400;
  }

  .options input[type="checkbox"] {
    width: auto;
    margin: 0;
    cursor: pointer;
    accent-color: #667eea;
  }

  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
  }

  button:active { transform: translateY(0); }

  button.secondary {
    background: #f0f0f0;
    color: #333;
    margin-top: 10px;
  }

  button.secondary:hover {
    background: #e0e0e0;
    box-shadow: none;
  }

  #qr-result {
    margin-top: 25px;
    text-align: center;
    display: none;
  }

  #qr-result.show {
    display: block;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #qrcode {
    display: inline-block;
    padding: 15px;
    background: white;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
  }

  #qrcode img, #qrcode canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .buttons { margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
  <h1>🔗 Генератор QR-кодов</h1>

  <label for="text">Текст или ссылка</label>
  <textarea id="text" placeholder="Введите текст или URL...">https://example.com</textarea>

  <div class="row">
    <div>
      <label for="size">Размер (px)</label>
      <input type="number" id="size" value="300" min="100" max="1000" step="50">
    </div>
    <div>
      <label for="color">Цвет кода</label>
      <input type="text" id="color" value="#000000" placeholder="#000000">
    </div>
  </div>

  <label>Цвет фона</label>
  <input type="text" id="bgcolor" value="#ffffff" placeholder="#ffffff">

  <div class="options">
    <label><input type="checkbox" id="margin" checked> Отступы</label>
    <label><input type="checkbox" id="darkMode"> Тёмный QR</label>
  </div>

  <button id="generate">Сгенерировать QR-код</button>

  <div id="qr-result">
    <div id="qrcode"></div>
    <div class="buttons">
      <button class="secondary" id="download">💾 Скачать PNG</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const textInput  = document.getElementById('text');
  const sizeInput  = document.getElementById('size');
  const colorInput = document.getElementById('color');
  const bgInput    = document.getElementById('bgcolor');
  const marginChk  = document.getElementById('margin');
  const darkChk    = document.getElementById('darkMode');
  const result     = document.getElementById('qr-result');
  const qrContainer= document.getElementById('qrcode');

  let currentQR = null;

  // Автогенерация при загрузке
  window.addEventListener('load', generate);

  // Горячая клавиша: Ctrl+Enter для генерации
  textInput.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') generate();
  });

  darkChk.addEventListener('change', () => {
    if (darkChk.checked) {
      colorInput.value = '#ffffff';
      bgInput.value = '#1a1a1a';
    } else {
      colorInput.value = '#000000';
      bgInput.value = '#ffffff';
    }
  });

  document.getElementById('generate').addEventListener('click', generate);
  document.getElementById('download').addEventListener('click', download);

  function generate() {
    const text = textInput.value.trim();

    if (!text) {
      alert('Введите текст или ссылку!');
      return;
    }

    const size = Math.min(Math.max(parseInt(sizeInput.value) || 300, 100), 1000);

    // Очистка
    qrContainer.innerHTML = '';

    // qrcodejs создаёт canvas + img внутри контейнера
    currentQR = new QRCode(qrContainer, {
      text: text,
      width: size,
      height: size,
      colorDark: colorInput.value || '#000000',
      colorLight: bgInput.value || '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    result.classList.add('show');
  }

  function download() {
    const canvas = qrContainer.querySelector('canvas');
    const img    = qrContainer.querySelector('img');

    const link = document.createElement('a');
    link.download = 'qrcode.png';

    if (canvas) {
      link.href = canvas.toDataURL('image/png');
    } else if (img && img.src) {
      link.href = img.src;
    } else {
      alert('QR-код ещё не сгенерирован');
      return;
    }

    link.click();
  }
</script>

</body>
</html>
