<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 100%;
  }

  h1 { color: #333; margin-bottom: 20px; font-size: 22px; text-align: center; }

  label {
    display: block; color: #555; margin-bottom: 8px;
    font-size: 14px; font-weight: 600;
  }

  textarea, input[type="text"], input[type="number"] {
    width: 100%; padding: 12px 15px;
    border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 15px; font-family: inherit;
    transition: border-color 0.2s; margin-bottom: 16px;
    outline: none; background: white;
  }

  textarea { resize: vertical; min-height: 80px; }
  textarea:focus, input:focus { border-color: #667eea; }

  .mode-tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f0f0f0; border-radius: 10px;
    padding: 4px; margin-bottom: 18px;
  }

  .mode-tab {
    padding: 10px; text-align: center; cursor: pointer;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    color: #666; transition: all 0.2s; user-select: none;
  }

  .mode-tab.active {
    background: white; color: #667eea;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  .color-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 14px;
    background: white; border: 2px solid #e0e0e0;
    border-radius: 10px; cursor: pointer;
    margin-bottom: 16px; transition: border-color 0.2s;
    position: relative; overflow: hidden;
    text-align: left; font-size: 15px; font-weight: 500; color: #333;
  }

  .color-btn:hover { border-color: #667eea; }

  .color-btn .swatch-preview {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid #e0e0e0; flex-shrink: 0;
  }

  .color-btn .hex-value {
    font-family: monospace; color: #666; font-size: 14px;
    text-transform: uppercase;
  }

  .color-btn .chevron { margin-left: auto; color: #999; font-size: 18px; }

  .color-btn input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: none; padding: 0;
  }

  .upload-zone {
    border: 2px dashed #d0d0d0; border-radius: 10px;
    padding: 18px; text-align: center; color: #888;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    margin-bottom: 14px; position: relative; background: #fafafa;
    min-height: 90px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
  }

  .upload-zone:hover {
    border-color: #667eea; color: #667eea; background: #f5f7ff;
  }

  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  .upload-zone.has-file {
    border-color: #38a169; color: #38a169;
    background: #f0fff4; border-style: solid;
  }

  .upload-zone img.preview {
    max-width: 100px; max-height: 100px;
    border-radius: 8px; object-fit: contain;
  }

  .upload-zone .hint { font-size: 12px; color: #999; margin-top: 4px; }

  .upload-status {
    font-size: 13px; padding: 8px 12px;
    border-radius: 8px; margin-bottom: 14px; display: none;
  }

  .upload-status.show { display: block; }
  .upload-status.success { background: #f0fff4; color: #2f855a; }
  .upload-status.error { background: #fff5f5; color: #c53030; }

  .options-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 16px;
  }

  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s; outline: none;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }

  button:focus { outline: none; }
  button::-moz-focus-inner { border: 0; }

  #generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
  }

  #generate:active { transform: translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000; opacity: 0;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.show { display: flex; opacity: 1; }

  .modal {
    background: white; border-radius: 20px; padding: 28px;
    max-width: 480px; width: 100%; max-height: 90vh;
    overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    transform: scale(0.9); transition: transform 0.3s ease;
    position: relative; text-align: center;
  }

  .modal-overlay.show .modal { transform: scale(1); }

  .modal h2 { color: #333; margin-bottom: 18px; font-size: 20px; }

  #qrcode {
    display: inline-block; padding: 20px;
    background: white; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin: 0 auto 18px; line-height: 0;
  }

  #qrcode canvas, #qrcode img {
    display: block; max-width: 100%; height: auto;
  }

  .close-btn {
    position: absolute; top: 14px; right: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #f0f0f0; border: none; cursor: pointer;
    font-size: 18px; color: #666;
    display: flex; align-items: center; justify-content: center;
    padding: 0; transition: background 0.2s, transform 0.2s; line-height: 1;
  }

  .close-btn:hover {
    background: #e0e0e0; transform: rotate(90deg); box-shadow: none;
  }

  .modal-buttons {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  .btn-secondary { background: #f0f0f0; color: #333; }

  .btn-secondary:hover {
    background: #e0e0e0; box-shadow: none; transform: none;
  }

  .warn-box {
    background: #fffaf0; border-left: 3px solid #dd6b20;
    padding: 10px 12px; border-radius: 6px;
    font-size: 12px; color: #7b341e;
    margin-bottom: 14px; text-align: left; line-height: 1.45;
  }
</style>
 </head>
 <body>

<div class="container">
  <h1>🔗 Генератор QR</h1>

  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="text">📝 Текст / Ссылка</div>
    <div class="mode-tab" data-mode="image">🖼 Картинка</div>
  </div>

  <div class="mode-panel active" data-panel="text">
    <label for="text">Текст или ссылка</label>
    <textarea id="text" placeholder="Введите текст...">Привет, мир! 🎉</textarea>
  </div>

  <div class="mode-panel" data-panel="image">
    <label>Загрузите маленькую картинку</label>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="image-input" accept="image/*">
      <span id="upload-placeholder">📷 Выбрать картинку</span>
      <span class="hint">≤ 2 КБ, ~36×36 px</span>
    </div>
    <div class="upload-status" id="upload-status"></div>
    <div class="warn-box">
      ⚠️ Картинка вшивается прямо в QR. Максимум ~2 КБ.
    </div>
  </div>

  <div class="options-row">
    <div>
      <label for="size">Размер QR (px)</label>
      <input type="number" id="size" value="400" min="200" max="1200" step="50">
    </div>
    <div>
      <label for="margin">Отступ (px)</label>
      <input type="number" id="margin" value="20" min="0" max="100" step="5">
    </div>
  </div>

  <label>Цвет кода</label>
  <button type="button" class="color-btn" id="fg-btn">
    <div class="swatch-preview" id="fg-preview" style="background:#000000"></div>
    <span class="hex-value" id="fg-hex">#000000</span>
    <span class="chevron">▾</span>
    <input type="color" id="fg-color-input" value="#000000">
  </button>

  <label>Цвет фона</label>
  <button type="button" class="color-btn" id="bg-btn">
    <div class="swatch-preview" id="bg-preview" style="background:#ffffff"></div>
    <span class="hex-value" id="bg-hex">#FFFFFF</span>
    <span class="chevron">▾</span>
    <input type="color" id="bg-color-input" value="#ffffff">
  </button>

  <button id="generate">Сгенерировать QR-код</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close-btn" id="close-modal" title="Закрыть">✕</button>
    <h2>Ваш QR-код</h2>
    <div id="qrcode"></div>
    <div class="modal-buttons">
      <button class="btn-secondary" id="download">💾 Скачать</button>
      <button id="regenerate">🔄 Обновить</button>
    </div>
  </div>
 </div>

    getErrorCorrectPolynomial: function(errorCorrectLength) {
      var a = new QRPolynomial([1], 0);
      for (var i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
      return a;
    },
    getLengthInBits: function(mode, type) {
      if (1 <= type && type < 10) {
        switch(mode) { case 1: return 8; case 2: return 16; case 4: return 8; default: throw new Error("mode:"+mode); }
      } else if (type < 27) {
        switch(mode) { case 1: return 10; case 2: return 16; case 4: return 8; default: throw new Error("mode:"+mode); }
      } else if (type < 41) {
        switch(mode) { case 1: return 12; case 2: return 16; case 4: return 8; default: throw new Error("mode:"+mode); }
      } else { throw new Error("type:"+type); }
    },
    getLostPoint: function(qrCode) {
      var moduleCount = qrCode.getModuleCount(), lostPoint = 0;
      for (var row = 0; row < moduleCount; row++) {
        for (var col = 0; col < moduleCount; col++) {
          var sameCount = 0, dark = qrCode.isDark(row, col);
          for (var r = -1; r <= 1; r++) {
            if (row + r < 0 || moduleCount <= row + r) continue;
            for (var c = -1; c <= 1; c++) {
              if (col + c < 0 || moduleCount <= col + c) continue;
              if (r == 0 && c == 0) continue;
              if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
            }
          }
          if (sameCount > 5) lostPoint += (3 + sameCount - 5);
        }
      }
      for (var row = 0; row < moduleCount - 1; row++) {
        for (var col = 0; col < moduleCount - 1; col++) {
          var count = 0;
          if (qrCode.isDark(row, col)) count++;
          if (qrCode.isDark(row + 1, col)) count++;
          if (qrCode.isDark(row, col + 1)) count++;
          if (qrCode.isDark(row + 1, col + 1)) count++;
          if (count == 0 || count == 4) lostPoint += 3;
        }
      }
      for (var row = 0; row < moduleCount; row++) {
        for (var col = 0; col < moduleCount - 6; col++) {
          if (qrCode.isDark(row, col) && !qrCode.isDark(row, col+1) && qrCode.isDark(row, col+2) && qrCode.isDark(row, col+3) && qrCode.isDark(row, col+4) && !qrCode.isDark(row, col+5) && qrCode.isDark(row, col+6)) lostPoint += 40;
        }
      }
      for (var col = 0; col < moduleCount; col++) {
        for (var row = 0; row < moduleCount - 6; row++) {
          if (qrCode.isDark(row, col) && !qrCode.isDark(row+1, col) && qrCode.isDark(row+2, col) && qrCode.isDark(row+3, col) && qrCode.isDark(row+4, col) && !qrCode.isDark(row+5, col) && qrCode.isDark(row+6, col)) lostPoint += 40;
        }
      }
      var darkCount = 0;
      for (var col = 0; col < moduleCount; col++)
        for (var row = 0; row < moduleCount; row++)
          if (qrCode.isDark(row, col)) darkCount++;
      var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
      lostPoint += ratio * 10;
      return lostPoint;
    }
  };

  var QRMode = { MODE_NUMBER: 1<<0, MODE_ALPHA_NUM: 1<<1, MODE_8BIT_BYTE: 1<<2, MODE_KANJI: 1<<3 };
  var QRErrorCorrectLevel = { L: 1, M: 0, Q: 3, H: 2 };

  function QR8bitByte(data) { this.mode = QRMode.MODE_8BIT_BYTE; this.data = data; this.parsedData = utf8Encode(data); }
  QR8bitByte.prototype = {
    getLength: function() { return this.parsedData.length; },
    write: function(buffer) { for (var i = 0; i < this.parsedData.length; i++) buffer.put(this.parsedData[i], 8); }
  };

  function QRCodeModel(typeNumber, errorCorrectLevel) {
    this.typeNumber = typeNumber;
    this.errorCorrectLevel = errorCorrectLevel;
    this.modules = null;
    this.moduleCount = 0;
    this.dataCache = null;
    this.dataList = [];
  }
  QRCodeModel.prototype = {
    addData: function(data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
    isDark: function(row, col) {
      if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) throw new Error(row + "," + col);
      return this.modules[row][col];
    },
    getModuleCount: function() { return this.moduleCount; },
    make: function() { this.makeImpl(false, this.getBestMaskPattern()); },
    makeImpl: function(test, maskPattern) {
      this.moduleCount = this.typeNumber * 4 + 17;
      this.modules = new Array(this.moduleCount);
      for (var row = 0; row < this.moduleCount; row++) {
        this.modules[row] = new Array(this.moduleCount);
        for (var col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
      }
      this.setupPositionProbePattern(0, 0);
      this.setupPositionProbePattern(this.moduleCount - 7, 0);
      this.setupPositionProbePattern(0, this.moduleCount - 7);
      this.setupPositionAdjustPattern();
      this.setupTimingPattern();
      this.setupTypeInfo(test, maskPattern);
      if (this.typeNumber >= 7) this.setupTypeNumber(test);
      if (this.dataCache == null) this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
      this.mapData(this.dataCache, maskPattern);
    },
    setupPositionProbePattern: function(row, col) {
      for (var r = -1; r <= 7; r++) {
        if (row + r <= -1 || this.moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c++) {
          if (col + c <= -1 || this.moduleCount <= col + c) continue;
          if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
            this.modules[row + r][col + c] = true;
          } else {
            this.modules[row + r][col + c] = false;
          }
        }
      }
    },
    getBestMaskPattern: function() {
      var minLostPoint = 0, pattern = 0;
      for (var i = 0; i < 8; i++) {
        this.makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(this);
        if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
      }
      return pattern;
    },
    setupTimingPattern: function() {
      for (var r = 8; r < this.moduleCount - 8; r++) {
        if (this.modules[r][6] != null) continue;
        this.modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < this.moduleCount - 8; c++) {
        if (this.modules[6][c] != null) continue;
        this.modules[6][c] = (c % 2 == 0);
      }
    },
    setupPositionAdjustPattern: function() {
      var pos = QRUtil.getPatternPosition(this.typeNumber);
      for (var i = 0; i < pos.length; i++) {
        for (var j = 0; j < pos.length; j++) {
          var row = pos[i], col = pos[j];
          if (this.modules[row][col] != null) continue;
          for (var r = -2; r <= 2; r++) {
            for (var c = -2; c <= 2; c++) {
              if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    },
    setupTypeNumber: function(test) {
      var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
      for (var i = 0; i < 18; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    },
    setupTypeInfo: function(test, maskPattern) {
      var data = (this.errorCorrectLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 6) this.modules[i][8] = mod;
        else if (i < 8) this.modules[i + 1][8] = mod;
        else this.modules[this.moduleCount - 15 + i][8] = mod;
      }
      for (var i = 0; i < 15; i++) {
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
        else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
        else this.modules[8][15 - i - 1] = mod;
      }
      this.modules[this.moduleCount - 8][8] = (!test);
    },
    mapData: function(data, maskPattern) {
      var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
      for (var col = this.moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col--;
        while (true) {
          for (var c = 0; c < 2; c++) {
            if (this.modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
              var mask = QRUtil.getMask(maskPattern, row, col - c);
              if (mask) dark = !dark;
              this.modules[row][col - c] = dark;
              bitIndex--;
              if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
        }
      }
    }
  };
  QRCodeModel.PAD0 = 0xEC;
  QRCodeModel.PAD1 = 0x11;
  QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
    var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
    var buffer = new QRBitBuffer();
    for (var i = 0; i < dataList.length; i++) {
      var data = dataList[i];
      buffer.put(data.mode, 4);
      buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
      data.write(buffer);
    }
    var totalDataCount = 0;
    for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
    if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error("code length overflow");
    if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
    while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
    while (true) {
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(QRCodeModel.PAD0, 8);
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(QRCodeModel.PAD1, 8);
    }
    return QRCodeModel.createBytes(buffer, rsBlocks);
  };
  QRCodeModel.createBytes = function(buffer, rsBlocks) {
    var offset = 0, maxDcCount = 0, maxEcCount = 0;
    var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
    for (var r = 0; r < rsBlocks.length; r++) {
      var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
      maxDcCount = Math.max(maxDcCount, dcCount);
      maxEcCount = Math.max(maxEcCount, ecCount);
      dcdata[r] = new Array(dcCount);
      for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
      offset += dcCount;
      var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
      var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
      var modPoly = rawPoly.mod(rsPoly);
      ecdata[r] = new Array(rsPoly.getLength() - 1);
      for (var i = 0; i < ecdata[r].length; i++) {
        var modIndex = i + modPoly.getLength() - ecdata[r].length;
        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
      }
    }
    var totalCodeCount = 0;
    for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
    var data = new Array(totalCodeCount), index = 0;
    for (var i = 0; i < maxDcCount; i++)
      for (var r = 0; r < rsBlocks.length; r++)
        if (i < dcdata[r].length) data[index++] = dcdata[r][i];
    for (var i = 0; i < maxEcCount; i++)
      for (var r = 0; r < rsBlocks.length; r++)
        if (i < ecdata[r].length) data[index++] = ecdata[r][i];
    return data;
  };

  function getTypeNumber(text) {
    var length = utf8Encode(text).length;
    for (var type = 1; type <= 40; type++) {
      var rsBlocks = QRRSBlock.getRSBlocks(type, QRErrorCorrectLevel.L);
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
      var capacity = totalDataCount - 2;
      if (length <= capacity) return type;
    }
    throw new Error('Текст слишком длинный для QR');
  }

  var QRCodeAPI = {
    CorrectLevel: QRErrorCorrectLevel,
    toCanvas: function(canvas, text, options, callback) {
      if (typeof options === 'function') { callback = options; options = {}; }
      options = options || {};
      try {
        var errLevel = options.errorCorrectionLevel === 'H' ? QRErrorCorrectLevel.H
                     : options.errorCorrectionLevel === 'Q' ? QRErrorCorrectLevel.Q
                     : options.errorCorrectionLevel === 'M' ? QRErrorCorrectLevel.M
                     : QRErrorCorrectLevel.L;
        var typeNumber = getTypeNumber(text);
        var qr = new QRCodeModel(typeNumber, errLevel);
        qr.addData(text);
        qr.make();
        var moduleCount = qr.getModuleCount();
        var size = options.width || 256;
        var margin = options.margin != null ? options.margin : 0;
        var totalSize = size + margin * 2;
        var cellSize = size / moduleCount;
        canvas.width = totalSize;
        canvas.height = totalSize;
        var ctx = canvas.getContext('2d');
        var darkColor = (options.color && options.color.dark) || '#000000';
        var lightColor = (options.color && options.color.light) || '#ffffff';
        ctx.fillStyle = lightColor;
        ctx.fillRect(0, 0, totalSize, totalSize);
        ctx.fillStyle = darkColor;
        for (var row = 0; row < moduleCount; row++) {
          for (var col = 0; col < moduleCount; col++) {
            if (qr.isDark(row, col)) {
              var x = margin + Math.round(col * cellSize);
              var y = margin + Math.round(row * cellSize);
              var w = Math.round((col + 1) * cellSize) - Math.round(col * cellSize);
              var h = Math.round((row + 1) * cellSize) - Math.round(row * cellSize);
              ctx.fillRect(x, y, w, h);
            }
          }
        }
        if (callback) callback(null);
      } catch (e) {
        if (callback) callback(e);
        else throw e;
      }
    }
  };

  global.QRCode = QRCodeAPI;
})(window);
</script>
<script>
  let fgColor = '#000000';
  let bgColor = '#ffffff';
  let currentMode = 'text';
  let imageDataURL = null;

  const MAX_SIZE_BYTES = 2048;

  const fgInput = document.getElementById('fg-color-input');
  const bgInput = document.getElementById('bg-color-input');

  fgInput.addEventListener('input', e => {
    fgColor = e.target.value;
    document.getElementById('fg-preview').style.background = fgColor;
    document.getElementById('fg-hex').textContent = fgColor.toUpperCase();
  });

  bgInput.addEventListener('input', e => {
    bgColor = e.target.value;
    document.getElementById('bg-preview').style.background = bgColor;
    document.getElementById('bg-hex').textContent = bgColor.toUpperCase();
  });

  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      document.querySelector(`.mode-panel[data-panel="${currentMode}"]`).classList.add('active');
    });
  });

  const uploadZone = document.getElementById('upload-zone');
  const imageInput = document.getElementById('image-input');
  const uploadPlaceholder = document.getElementById('upload-placeholder');
  const uploadStatus = document.getElementById('upload-status');

  imageInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      showStatus('error', '❌ Это не картинка');
      return;
    }

    if (file.size > MAX_SIZE_BYTES) {
      showStatus('error', `❌ Файл ${(file.size/1024).toFixed(1)} КБ. Максимум 2 КБ.`);
      return;
    }

    const reader = new FileReader();
    reader.onload = ev => {
      imageDataURL = ev.target.result;
      uploadZone.classList.add('has-file');
      uploadPlaceholder.innerHTML = `<img src="${imageDataURL}" class="preview">`;
      showStatus('success', `✅ Готово (${(file.size/1024).toFixed(1)} КБ).`);
    };
    reader.readAsDataURL(file);
  });

  function showStatus(type, text) {
    uploadStatus.className = 'upload-status show ' + type;
    uploadStatus.textContent = text;
  }

  const modal = document.getElementById('modal');
  const qrContainer = document.getElementById('qrcode');

  document.getElementById('generate').addEventListener('click', generate);
  document.getElementById('regenerate').addEventListener('click', generate);
  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('download').addEventListener('click', download);

  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  function generate() {
    let content = '';

    if (currentMode === 'text') {
      content = document.getElementById('text').value;
      if (!content || !content.trim()) {
        alert('Введите текст или ссылку!');
        return;
      }
    } else {
      if (!imageDataURL) {
        alert('Сначала выберите картинку (≤ 2 КБ)!');
        return;
      }
      content = imageDataURL;
    }

    const size = Math.min(Math.max(parseInt(document.getElementById('size').value) || 400, 200), 1200);
    const margin = Math.min(Math.max(parseInt(document.getElementById('margin').value) || 20, 0), 100);

    qrContainer.style.padding = margin + 'px';
    qrContainer.innerHTML = '';

    try {
      const canvas = document.createElement('canvas');
      qrContainer.appendChild(canvas);

      QRCode.toCanvas(canvas, content, {
        width: size,
        margin: 0,
        color: { dark: fgColor, light: bgColor },
        errorCorrectionLevel: 'L'
      }, function(err) {
        if (err) {
          alert('Ошибка: ' + err.message);
          console.error(err);
          return;
        }
        modal.classList.add('show');
      });
    } catch (err) {
      alert('Ошибка: ' + err.message);
      console.error(err);
    }
  }

  function closeModal() {
    modal.classList.remove('show');
  }

  function download() {
    const canvas = qrContainer.querySelector('canvas');
    if (!canvas) { alert('QR-код ещё не сгенерирован'); return; }

    const margin = parseInt(document.getElementById('margin').value) || 20;
    const out = document.createElement('canvas');
    out.width = canvas.width + margin * 2;
    out.height = canvas.height + margin * 2;

    const ctx = out.getContext('2d');
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(canvas, margin, margin);

    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = out.toDataURL('image/png');
    link.click();
  }
</script>

</body>
